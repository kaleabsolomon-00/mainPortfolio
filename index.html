<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaleab | Software Engineer</title>
    <meta
      name="description"
      content="Full-stack and AI/ML software engineer. Portfolio of Kaleab."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#381932" />

    <!-- Link previews (LinkedIn, Telegram, WhatsApp, Slack…).
         After you deploy, replace YOUR-SITE.com with your real address.
         The og:image must be a FULL address, not just a path.
         Create a 1200×630 image, save it as public/og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kaleab | Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack and AI/ML software engineer. Portfolio of Kaleab."
    />
    <meta property="og:url" content="https://YOUR-SITE.com/" />
    <meta property="og:image" content="https://YOUR-SITE.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Cinzel Decorative (display/headings) + PT Serif (body text).
         To swap fonts: change this link AND the two --font-* values in src/styles/tokens.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nova+Square&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
